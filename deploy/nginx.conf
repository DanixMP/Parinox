# Example nginx config — TLS termination + WS upgrade + media static.
# Replace yourhost.ir with the real domain; certs via certbot.

upstream team_api {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name yourhost.ir;

    # ssl_certificate     /etc/letsencrypt/live/yourhost.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourhost.ir/privkey.pem;

    client_max_body_size 10m;

    location /ws/ {
        proxy_pass http://team_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Trailing slash on upstream strips the /api prefix
    location /api/ {
        proxy_pass http://team_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Also proxy root API paths used by local/dev clients
    location ~ ^/(login|me|users|rooms|posts|stories|livekit|health|admin)/ {
        proxy_pass http://team_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Media must go through the authenticated API (Bearer or access_token query)
    location /media/ {
        proxy_pass http://team_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        # Avoid caching private media at the edge
        add_header Cache-Control "private, max-age=0, no-store";
    }
}

server {
    listen 443 ssl http2;
    server_name turn.yourhost.ir;

    # ssl_certificate     /etc/letsencrypt/live/turn.yourhost.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/turn.yourhost.ir/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
