name: team_app
description: Team App — chat, calls, explore, stories
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: 9.2.4
  livekit_client: ^2.3.1
  flutter_staggered_grid_view: ^0.7.0
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  google_fonts: 6.2.1
  shadcn_ui: 0.40.0
  video_player: ^2.11.1
  share_plus: ^12.0.2
  connectivity_plus: ^7.3.1
  moon_design: ^1.1.0
  nes_ui: ^0.30.0
  hux: 1.2.1
  curved_navigation_bar: 1.0.6
  animated_notch_bottom_bar: 1.0.4
  shadcn_flutter: 0.0.53
  just_audio: ^0.10.6
  cupertino_onboarding: ^1.3.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#2A3439"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#2A3439"
    theme_color: "#2A3439"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
